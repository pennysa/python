{% extends "core/base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'treedoc/treedoc.css' %}">

<body class="treedoc-page">

<h1 class="treedoc-title">📁 我的資料夾</h1>

<div class="flex justify-end mb-4">
  <button onclick="openFolderModal()"
          class="px-4 py-2 rounded-lg font-semibold bg-green-500 text-white hover:bg-green-600">
    ➕ 新資料夾
  </button>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
  {% for f in folders %}
  <a href="{% url 'treedoc:folder_detail' f.id %}"
     class="treedoc-card hover:scale-[1.02] transition cursor-pointer">
     🌲 <span class="font-semibold">{{ f.name }}</span>
  </a>
  {% endfor %}
</div>

<!-- Modal -->
<div id="folderModal" class="hidden fixed inset-0 bg-black bg-opacity-30 backdrop-blur-sm flex items-center justify-center">
  <div class="treedoc-card w-80 p-6">
    <h2 class="text-xl font-bold mb-3">新增資料夾</h2>

    <form method="POST">
      {% csrf_token %}
      <input type="text" name="folder_name"
        class="w-full p-2 rounded border mb-4"
        placeholder="輸入資料夾名稱…">

      <button class="px-4 py-2 bg-green-500 text-white rounded w-full">
        建立
      </button>
    </form>

    <button onclick="closeFolderModal()" class="mt-3 text-red-500 w-full">取消</button>
  </div>
</div>

<script>
function openFolderModal(){ document.getElementById('folderModal').classList.remove('hidden'); }
function closeFolderModal(){ document.getElementById('folderModal').classList.add('hidden'); }
</script>

</body>
{% endblock %}
