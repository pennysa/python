{% extends "core/base.html" %}
{% block content %}

<div class="max-w-4xl mx-auto px-6 py-8">

  <!-- 返回 -->
  <a href="{% url 'treedoc:folder_list' %}"
     class="text-sm text-blue-500 hover:underline">
    ← 回到資料夾
  </a>

  <!-- 標題 -->
  <h1 class="text-2xl font-bold flex items-center gap-2 mt-4 mb-6">
    📁 {{ folder.name }}
  </h1>

  <!-- 新增文件 -->
  <form method="POST"
        action="{% url 'treedoc:create_document' folder.id %}"
        class="flex gap-2 mb-8">
    {% csrf_token %}
    <input name="title" required
           placeholder="輸入文件名稱"
           class="flex-1 border rounded-lg px-4 py-2">
    <button class="px-4 py-2 rounded-lg bg-green-500 text-white font-semibold">
      ＋ 新增文件
    </button>
  </form>

  <!-- 文件列表 -->
  {% if documents %}
    <ul class="space-y-3">
      {% for d in documents %}
        <li>
          <a href="{% url 'treedoc:document_detail' d.id %}"
             class="block border rounded-lg px-4 py-3 hover:bg-gray-50">
            📄 {{ d.title }}
          </a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="text-gray-500">尚未建立任何文件</p>
  {% endif %}

</div>

{% endblock %}
